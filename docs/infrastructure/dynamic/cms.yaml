# Traefik file-provider route for the cms project (docs/projects/cms.md, step 22.4).
# Location on the server: /home/dad/workspace/infrastructure/dynamic/cms.yaml
#
# The cms-admin compose stack publishes its nginx on the docker0 gateway (HTTP_PORT=172.17.0.1:8081 in
# www/cms/.env.prod.local); Traefik reaches it through host.docker.internal (extra_hosts: host-gateway).
# Routed: the admin, the API, their static files and the exact "/" (the app redirects it to /admin).
# When the client site takes "/" (cms.md 22.11), remove Path(`/`) from the rule.
# No redirectscheme middleware: Cloudflare does http -> https (it would loop behind the tunnel).
http:
  routers:
    cms:
      rule: Host(`cms.lucked.me`) && (Path(`/`) || PathPrefix(`/admin`) || PathPrefix(`/api`) || PathPrefix(`/assets`) || PathPrefix(`/bundles`) || PathPrefix(`/uploaded`))
      entryPoints:
        - web
      service: cms
  services:
    cms:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8081"
